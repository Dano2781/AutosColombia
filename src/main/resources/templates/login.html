<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="login"><h1>Autos Colombia</h1><p>Gestión de acceso vehicular</p><form method="post" action="/login"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button>Iniciar sesión</button><p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p><p class="success" th:if="${param.logout}">Sesión cerrada.</p></form></main></body></html>
