<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Celdas | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div><h1>Autos Colombia</h1><p>Gestión de celdas</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main><nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a><a th:if="${supervisor}" href="/movimientos">Movimientos</a></nav>
<section class="card"><div class="section-title"><h2>Inventario de celdas</h2><a th:if="${supervisor}" class="button-link" href="/celdas/nueva">Registrar celda</a></div>
<form method="get" action="/celdas" class="filters"><label>Buscar código<input name="buscar" th:value="${buscar}" placeholder="Ej. A-001"></label><label>Tipo<select name="tipo"><option value="">Todos</option><option value="AUTOMOVIL" th:selected="${tipo == 'AUTOMOVIL'}">Automóvil</option><option value="MOTOCICLETA" th:selected="${tipo == 'MOTOCICLETA'}">Motocicleta</option><option value="MIXTA" th:selected="${tipo == 'MIXTA'}">Mixta</option></select></label><label>Estado<select name="estado"><option value="">Todos</option><option value="LIBRE" th:selected="${estado == 'LIBRE'}">Libre</option><option value="OCUPADA" th:selected="${estado == 'OCUPADA'}">Ocupada</option><option value="INACTIVA" th:selected="${estado == 'INACTIVA'}">Inactiva</option></select></label><button>Filtrar</button></form>
<div class="table-wrap"><table><thead><tr><th>Código</th><th>Tipo</th><th>Estado</th><th>Vehículo actual</th><th>Acción</th></tr></thead><tbody><tr th:each="c : ${celdas}"><td th:text="${c.codigo}"></td><td th:text="${c.tipo}"></td><td><span class="pill" th:text="${c.estado}" th:classappend="${c.estado == 'LIBRE'} ? ' closed' : (${c.estado == 'OCUPADA'} ? ' open' : ' inactive')"></span></td><td th:text="${c.placa_actual} ?: '—'"></td><td><a th:href="@{/celdas/{id}(id=${c.id_celda})}">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(celdas)}"><td colspan="5">No se encontraron celdas.</td></tr></tbody></table></div></section></main></body></html>
