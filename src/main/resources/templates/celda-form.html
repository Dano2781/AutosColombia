<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario de celda | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div><h1>Autos Colombia</h1><p>Registro y actualización de celdas</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main><nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a></nav><section class="card"><h2 th:text="${celda == null ? 'Registrar celda' : 'Actualizar celda'}"></h2><p class="error" th:if="${error}" th:text="${error}"></p>
<form th:action="${celda == null ? '/celdas/guardar' : '/celdas/' + celda.id_celda + '/editar'}" method="post" class="form-grid">
<label>Código de celda<input name="codigo" maxlength="10" placeholder="Ej. A-001" required th:if="${celda == null}" th:value="${codigo}"><input name="codigo" disabled th:if="${celda != null}" th:value="${celda.codigo}"></label>
<label>Tipo de compatibilidad<select name="tipo" required><option value="AUTOMOVIL" th:selected="${(celda != null ? celda.tipo : tipo) == 'AUTOMOVIL'}">Automóvil</option><option value="MOTOCICLETA" th:selected="${(celda != null ? celda.tipo : tipo) == 'MOTOCICLETA'}">Motocicleta</option><option value="MIXTA" th:selected="${(celda != null ? celda.tipo : tipo) == 'MIXTA'}">Mixta</option></select></label>
<div class="wide" th:if="${celda == null}"><small>La celda se crea automáticamente con estado LIBRE.</small></div><div class="wide form-actions"><a class="button-link secondary-link" href="/celdas">Cancelar</a><button>Guardar celda</button></div></form></section></main></body></html>
