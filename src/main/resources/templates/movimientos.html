<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimientos | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body><header><div><h1>Autos Colombia</h1><p>Consulta de movimientos</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main><nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a><a href="/movimientos">Consultar movimientos</a></nav><section class="card"><h2>Filtros</h2><form method="get" action="/movimientos" class="filters"><label>Placa<input name="placa" th:value="${placa}"></label><label>Estado<select name="estado"><option value="">Todos</option><option value="ABIERTA" th:selected="${estado == 'ABIERTA'}">Abierta</option><option value="CERRADA" th:selected="${estado == 'CERRADA'}">Cerrada</option></select></label><label>Desde<input type="date" name="desde" th:value="${desde}"></label><label>Hasta<input type="date" name="hasta" th:value="${hasta}"></label><button>Buscar</button></form></section><section class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Placa</th><th>Celda</th><th>Entrada</th><th>Salida</th><th>Estado</th><th>Operario entrada</th><th>Operario salida</th></tr></thead><tbody><tr th:each="m : ${movimientos}"><td th:text="${m.id_movimiento}"></td><td th:text="${m.placa}"></td><td th:text="${m.celda}"></td><td th:text="${m.fecha_hora_entrada}"></td><td th:text="${m.fecha_hora_salida} ?: '—'"></td><td><span class="pill" th:text="${m.estado}" th:classappend="${m.estado == 'ABIERTA'} ? ' open' : ' closed'"></span></td><td th:text="${m.operario_entrada}"></td><td th:text="${m.operario_salida} ?: '—'"></td></tr><tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="8">No hay movimientos para los filtros seleccionados.</td></tr></tbody></table></div></section></main></body></html>
