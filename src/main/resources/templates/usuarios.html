<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuarios | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div><h1>Autos Colombia</h1><p>Gestión de usuarios</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main>
<nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a><a th:if="${supervisor}" href="/movimientos">Movimientos</a></nav>
<section class="card"><div class="section-title"><h2>Usuarios registrados</h2><a th:if="${supervisor}" class="button-link" href="/usuarios/nuevo">Registrar usuario</a></div>
<form method="get" action="/usuarios" class="filters"><label>Buscar por documento o nombre<input name="buscar" th:value="${buscar}" placeholder="Documento o nombre"></label><label>Estado<select name="estado"><option value="">Todos</option><option value="ACTIVO" th:selected="${estado == 'ACTIVO'}">Activo</option><option value="INACTIVO" th:selected="${estado == 'INACTIVO'}">Inactivo</option></select></label><button>Buscar</button></form>
<div class="table-wrap"><table><thead><tr><th>Documento</th><th>Nombre completo</th><th>Teléfono</th><th>Correo</th><th>Vehículos</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
<tr th:each="u : ${usuarios}"><td th:text="${u.tipo_documento + ' ' + u.numero_documento}"></td><td th:text="${u.nombre_completo}"></td><td th:text="${u.telefono} ?: '—'"></td><td th:text="${u.email} ?: '—'"></td><td th:text="${u.cantidad_vehiculos}"></td><td><span class="pill" th:text="${u.estado}" th:classappend="${u.estado == 'ACTIVO'} ? ' closed' : ' inactive'"></span></td><td><a th:href="@{/usuarios/{id}(id=${u.id_usuario})}">Ver detalle</a></td></tr>
<tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7">No se encontraron usuarios.</td></tr></tbody></table></div></section></main></body></html>
