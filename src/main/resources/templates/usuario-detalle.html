<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de usuario | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div><h1>Autos Colombia</h1><p>Detalle del usuario</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main><nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a></nav><p class="error" th:if="${error}" th:text="${error}"></p>
<section class="card"><div class="section-title"><h2 th:text="${usuario.nombre_completo}"></h2><span class="pill" th:text="${usuario.estado}" th:classappend="${usuario.estado == 'ACTIVO'} ? ' closed' : ' inactive'"></span></div>
<div class="details-grid"><div><small>Tipo de documento</small><b th:text="${usuario.tipo_documento}"></b></div><div><small>Número de documento</small><b th:text="${usuario.numero_documento}"></b></div><div><small>Teléfono</small><b th:text="${usuario.telefono} ?: '—'"></b></div><div><small>Correo electrónico</small><b th:text="${usuario.email} ?: '—'"></b></div></div>
<div class="form-actions" th:if="${supervisor}"><a class="button-link" th:href="@{/usuarios/{id}/editar(id=${usuario.id_usuario})}">Editar información</a><form method="post" th:action="@{/usuarios/{id}/estado(id=${usuario.id_usuario})}"><input type="hidden" name="nuevoEstado" th:value="${usuario.estado == 'ACTIVO' ? 'INACTIVO' : 'ACTIVO'}"><button th:class="${usuario.estado == 'ACTIVO' ? 'danger' : 'success-button'}" th:text="${usuario.estado == 'ACTIVO' ? 'Inactivar usuario' : 'Activar usuario'}"></button></form></div></section>
<section class="card"><h2>Vehículos asociados</h2><div class="table-wrap"><table><thead><tr><th>Placa</th><th>Tipo</th><th>Marca</th><th>Color</th><th>Estado</th></tr></thead><tbody><tr th:each="v : ${vehiculos}"><td th:text="${v.placa}"></td><td th:text="${v.tipo}"></td><td th:text="${v.marca} ?: '—'"></td><td th:text="${v.color} ?: '—'"></td><td th:text="${v.estado}"></td></tr><tr th:if="${#lists.isEmpty(vehiculos)}"><td colspan="5">Este usuario no tiene vehículos registrados.</td></tr></tbody></table></div></section></main></body></html>
