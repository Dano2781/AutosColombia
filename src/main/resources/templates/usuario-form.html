<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario de usuario | Autos Colombia</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div><h1>Autos Colombia</h1><p>Registro y actualización de usuarios</p></div><form method="post" th:action="@{/logout}"><button class="secondary">Cerrar sesión</button></form></header><main>
<nav><a href="/">Accesos</a><a href="/usuarios">Usuarios</a><a href="/celdas">Celdas</a></nav><section class="card"><h2 th:text="${usuario == null ? 'Registrar usuario' : 'Actualizar usuario'}"></h2><p class="error" th:if="${error}" th:text="${error}"></p>
<form th:action="${usuario == null ? '/usuarios/guardar' : '/usuarios/' + usuario.id_usuario + '/editar'}" method="post" class="form-grid">
<label>Tipo de documento<select name="tipoDocumento" required><option value="CC" th:selected="${(usuario != null ? usuario.tipo_documento : tipoDocumento) == 'CC'}">Cédula de ciudadanía</option><option value="CE" th:selected="${(usuario != null ? usuario.tipo_documento : tipoDocumento) == 'CE'}">Cédula de extranjería</option><option value="PAS" th:selected="${(usuario != null ? usuario.tipo_documento : tipoDocumento) == 'PAS'}">Pasaporte</option><option value="NIT" th:selected="${(usuario != null ? usuario.tipo_documento : tipoDocumento) == 'NIT'}">NIT</option></select></label>
<label>Número de documento<input name="numeroDocumento" maxlength="20" required th:value="${usuario != null ? usuario.numero_documento : numeroDocumento}"></label>
<label class="wide">Nombre completo<input name="nombreCompleto" maxlength="120" required th:value="${usuario != null ? usuario.nombre_completo : nombreCompleto}"></label>
<label>Teléfono<input name="telefono" maxlength="25" th:value="${usuario != null ? usuario.telefono : telefono}"></label><label>Correo electrónico<input type="email" name="email" maxlength="120" th:value="${usuario != null ? usuario.email : email}"></label>
<div class="wide form-actions"><a class="button-link secondary-link" href="/usuarios">Cancelar</a><button type="submit">Guardar usuario</button></div></form></section></main></body></html>
