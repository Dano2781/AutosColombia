spring.application.name=Autos_Colombia
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autos_colombia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
